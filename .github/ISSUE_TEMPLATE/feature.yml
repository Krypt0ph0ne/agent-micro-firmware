name: Feature request
description: Propose a firmware, protocol, tooling, or documentation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Protocol and hardware compatibility impact
      description: Explain effects on Raw HID v2, CP magic, VID:PID, flash size, or recovery.
    validations:
      required: true
